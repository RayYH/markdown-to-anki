[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markdown-to-anki"
version = "0.2.0"
description = "Convert Markdown files into Anki cards via AnkiConnect"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["anki", "markdown", "flashcards", "ankiconnect", "spaced-repetition"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Utilities",
]
dependencies = [
    "beautifulsoup4",
    "click",
    "markdown",
    "pymdown-extensions",
    "python-dotenv",
    "python-markdown-math",
    "pyyaml",
]

[project.urls]
Homepage = "https://github.com/rayyh/markdown-to-anki"
Repository = "https://github.com/rayyh/markdown-to-anki"
Issues = "https://github.com/rayyh/markdown-to-anki/issues"
Changelog = "https://github.com/rayyh/markdown-to-anki/releases"

[project.scripts]
m2a = "markdown_to_anki.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["markdown_to_anki"]

[tool.uv]

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "pytest-mock",
    "pytest-watch",
    "ruff",
]

[tool.pytest.ini_options]
filterwarnings = ["ignore::UserWarning"]

[tool.ruff]
line-length = 80

[tool.ruff.lint]
ignore = ["E111", "E114"]
