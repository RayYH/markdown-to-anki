[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markdown-to-anki"
version = "0.1.0"
description = "Convert Markdown files into Anki cards via AnkiConnect"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4",
    "click",
    "markdown",
    "pymdown-extensions",
    "python-dotenv",
    "python-markdown-math",
    "pyyaml",
]

[project.scripts]
m2a = "markdown_to_anki.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["markdown_to_anki"]

[tool.uv]

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "pytest-mock",
    "pytest-watch",
    "ruff",
]

[tool.pytest.ini_options]
filterwarnings = ["ignore::UserWarning"]

[tool.ruff]
line-length = 80

[tool.ruff.lint]
ignore = ["E111", "E114"]
